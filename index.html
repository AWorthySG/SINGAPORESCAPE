<body>
  <div id="game-root">
    <!-- World rendering -->
    <canvas id="game-canvas"></canvas>

    <!-- Top-left action / hover text, RuneScape style -->
    <div id="hover-text"></div>

    <!-- On-screen objective tracker (active quest + Slayer task) -->
    <div id="quest-tracker" class="hidden"></div>

    <!-- Current region / zone label (top-centre) -->
    <div id="region-label"></div>

    <!-- Boss battle bar (top-centre, shown while engaged with a boss) -->
    <div id="boss-bar" class="hidden">
      <div id="boss-bar-portrait" aria-hidden="true"><div class="bp-img"></div><span class="bp-badge"></span></div>
      <div id="boss-bar-main">
      <div id="boss-bar-head"><div id="boss-bar-name"></div><span id="boss-bar-mech" class="hidden"></span></div>
      <div id="boss-bar-track"><div id="boss-bar-fill"></div><div id="boss-bar-ticks"></div><span id="boss-bar-life"></span></div>
      <div id="boss-bar-cast"><i></i></div>
      <div id="boss-bar-info"></div>
      </div>
    </div>

    <!-- Floating XP drops -->
    <div id="xp-drops"></div>

    <!-- Minimap (top-right) -->
    <div id="minimap-panel">
      <button id="minimap-collapse" title="Collapse minimap" aria-label="Collapse minimap">&#9662;</button>
      <canvas id="minimap-canvas" width="160" height="160"></canvas>
      <div id="minimap-compass">N</div>
      <div id="daynight-badge" title="">
        <span id="daynight-sun" class="dn-icon"></span>
        <span id="daynight-moon" class="dn-icon"></span>
      </div>
      <button id="map-btn" title="Open world map (M)">MAP</button>
      <div id="minimap-region"></div>
      <div id="hp-orb" class="orb" title="Hitpoints"><span id="hp-orb-value">10</span><span class="orb-cap">HP</span></div>
      <div id="prayer-orb" class="orb" title="Faith: full, it powers a Prayer Burst (L)"><span id="prayer-orb-value">0</span><span class="orb-cap">Faith</span></div>
      <div id="spec-orb" class="orb" title="Special attack — click to arm"><span id="spec-orb-value">100</span><span class="orb-cap">Special</span></div>
    </div>

    <!-- Chat box (bottom-left) -->
    <div id="chatbox">
      <div id="chat-head"><span id="chat-title">Chat</span><button id="chat-collapse" title="Collapse chat" aria-label="Collapse chat">&#9662;</button></div>
      <div id="chat-log"></div>
      <div id="chat-tabs">
        <span class="chat-tab active" data-filter="all">All</span>
        <span class="chat-tab" data-filter="game">Game</span>
        <span class="chat-tab" data-filter="combat">Combat</span>
      </div>
    </div>

    <!-- Side panel with tabs (bottom-right) -->
    <div id="sidepanel">
      <!-- Phones: drag handle of the bottom sheet (swipe down or tap to fold) -->
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="panel-head"><span id="panel-title">Inventory</span><button id="panel-collapse" title="Collapse panel" aria-label="Collapse panel">&#9662;</button></div>
      <div id="panel-body">
        <div id="panel-subtabs" class="hidden" role="tablist"></div>
        <section class="panel-view" data-view="inventory">
          <div id="inventory-bar">
            <div id="inv-tabs"></div>
            <button id="inv-sort" title="Sort: merge stacks and group by type" aria-label="Sort">&#8645;</button>
          </div>
          <div id="inventory-grid"></div>
        </section>
        <section class="panel-view hidden" data-view="equipment">
          <div id="equipment-layout"></div>
          <div id="equipment-bonuses"></div>
        </section>
        <section class="panel-view hidden" data-view="skills">
          <div id="skills-grid"></div>
          <div id="skills-total"></div>
          <div id="alignment-readout"></div>
        </section>
        <section class="panel-view hidden" data-view="combat">
          <div id="combat-panel"></div>
        </section>
        <section class="panel-view hidden" data-view="prayer">
          <div id="prayer-panel"></div>
        </section>
        <section class="panel-view hidden" data-view="quests">
          <div id="quest-panel"></div>
        </section>
        <section class="panel-view hidden" data-view="stats">
          <div id="stats-panel"></div>
        </section>
        <section class="panel-view hidden" data-view="achievements">
          <div id="achievement-panel"></div>
        </section>
        <section class="panel-view hidden" data-view="story">
          <div id="story-panel"></div>
        </section>
        <section class="panel-view hidden" data-view="settings">
          <div id="settings-panel"></div>
        </section>
      </div>
      <div id="panel-tabs">
        <!-- Five tabs; Bag, Combat and Journal each hold two or three views,
             switched by the sub-tab row at the top of the panel body (ui.js: PANEL_TABS). -->
        <button class="tab-btn active" data-view="inventory" title="Bag and worn equipment"></button>
        <button class="tab-btn" data-view="skills" title="Skills"></button>
        <button class="tab-btn" data-view="combat" title="Combat, prayers and stats"></button>
        <button class="tab-btn" data-view="quests" title="Quest journal and achievements"></button>
        <button class="tab-btn" data-view="settings" title="Settings"></button>
      </div>
    </div>

    <!-- Active-combat ability bar (bottom-centre) -->
    <div id="ability-bar">
      <!-- Phones: the three auto switches fold into this one button (see "Responsive layout" in main.css) -->
      <button id="auto-menu-btn" aria-expanded="false" aria-controls="auto-row" title="Auto battle, gather and quest"><span class="am-dot" aria-hidden="true"></span>Auto</button>
      <div class="auto-row" id="auto-row">
        <button id="auto-battle-btn" class="ab-btn" aria-pressed="false" title="Auto battle (T): hunt monsters, eat when hurt and use your skills">
          <span class="ab-switch" aria-hidden="true"><i></i></span>
          <span class="ab-text"><b class="ab-label">Battle <kbd>T</kbd></b><span class="ab-status">Off</span></span>
        </button>
        <button id="auto-gather-btn" class="ab-btn" aria-pressed="false" title="Auto gather (Y): when a tree, rock or fishing spot runs dry, move on to the next one">
          <span class="ab-switch" aria-hidden="true"><i></i></span>
          <span class="ab-text"><b class="ab-label">Gather <kbd>Y</kbd></b><span class="ab-status">Off</span></span>
        </button>
        <button id="auto-quest-btn" class="ab-btn" aria-pressed="false" title="Auto quest (U): start, work through and hand in quests by yourself">
          <span class="ab-switch" aria-hidden="true"><i></i></span>
          <span class="ab-text"><b class="ab-label">Quest <kbd>U</kbd></b><span class="ab-status">Off</span></span>
        </button>
        <button id="auto-battle-cfg" title="Auto battle settings" aria-label="Auto battle settings">&#9881;</button>
      </div>
      <div id="adrenaline" title="Adrenaline — build it by landing and taking hits, spend it on abilities">
        <div id="adrenaline-fill"></div>
        <span id="adrenaline-label">ADRENALINE <b id="adrenaline-val">0%</b></span>
      </div>
      <div id="ability-buttons"></div>
    </div>

    <!-- Attack (touch screens): lock onto the nearest enemy; hold to keep fighting (G on a keyboard) -->
    <button id="attack-btn" title="Attack the nearest enemy (G). Hold to keep fighting."><span class="atk-icon" aria-hidden="true">&#9876;</span><span class="atk-label">Attack</span></button>

    <!-- Next target (touch screens): switch to the next closest enemy (Tab on a keyboard) -->
    <button id="target-btn" title="Next target (Tab): switch to the next closest enemy" aria-label="Next target"><span aria-hidden="true">&#8635;</span></button>

    <!-- Shown while aiming a skill: let go here to cancel it -->
    <div id="aim-cancel" class="hidden" aria-hidden="true"><img src="assets/icons/ui-cancel.webp" alt="" /></div>

    <!-- Interact: acts on the nearest thing (E / Space on a keyboard) -->
    <button id="interact-btn" title="Interact with the nearest thing (E or Space)"><span class="ib-verb">Interact</span></button>

    <!-- Right-click context menu -->
    <div id="context-menu" class="hidden"></div>

    <!-- Tooltip -->
    <div id="tooltip" class="hidden"></div>

    <!-- Modal interface (bank, shop, dialogue) -->
    <div id="modal-overlay" class="hidden">
      <div id="modal-window">
        <div class="sheet-handle" aria-hidden="true"></div>
        <div id="modal-title"></div>
        <button id="modal-close" title="Close">✕</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Banners and tips go to the notification lane (#notice-lane, src/ui/noticelane.js) -->

  </div>

  <!-- Title / splash screen featuring the A Worthy logo. It loads first (the
       bar under the title, driven by src/ui/title.js), then turns see-through
       over the live world, which the camera tours slowly behind it. -->
  <div id="splash" class="loading">
    <div class="title-skyline" aria-hidden="true"></div>
    <canvas class="title-heroes" aria-hidden="true"></canvas>
    <div class="title-particles" aria-hidden="true"></div>
    <div class="title-place" aria-hidden="true"></div>
    <div class="splash-inner">
      <img src="assets/mascot-login.webp" alt="" class="splash-mascot" />
      <p class="splash-lah" aria-hidden="true">Steady lah, adventurer!</p>
      <h1 class="splash-title">A-Worthy Adventure</h1>
      <p class="splash-sub"><span class="cosy-tag">Your cosy kampong adventure</span> &mdash; by <b>A&nbsp;Worthy</b></p>
      <img src="assets/logo.svg" alt="A-Worthy" class="splash-logo" />
      <div id="splash-loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="sl-track"><div class="sl-fill"></div></div>
        <p class="sl-status">Loading the game&hellip;</p>
        <p class="sl-tip" aria-live="polite"></p>
      </div>
      <button id="splash-enter">Enter Kampong Glam &#9654;</button>
      <p class="splash-controls">Joystick or W A S D to move &middot; Interact button, E or Space to act &middot; T, Y and U for auto battle, gather and quest</p>
    </div>
    <div class="title-fade" aria-hidden="true"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
